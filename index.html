<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TOTAL WORK — Gestion des logements" />
    <title>TOTAL WORK · Gestion des logements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      /* Applies the stored theme before first paint. React sets the same
         attribute on mount, but that runs after the browser has already
         painted, which flashed a light canvas at dark-mode users on load.
         Kept inline and blocking on purpose — it must beat the first paint. */
      try {
        document.documentElement.dataset.theme = localStorage.getItem('tw-theme') || 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>

  <!-- Vercel deployment trigger -->
</html>
